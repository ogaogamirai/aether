<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aether3D v2 — Phase 1 Prototype</title>
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <style>
    :root {
      --bar-bg: rgba(20, 22, 28, 0.92);
      --bar-fg: #e8e8f0;
      --accent: #5ac8d9;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0e12; font-family: system-ui, sans-serif; }
    #aether-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

    #label-layer {
      position: fixed; inset: 0; width: 100vw; height: 100vh;
      pointer-events: none; z-index: 5;
    }
    #label-layer text {
      font-size: 13px; fill: #e8e8f0;
      paint-order: stroke; stroke: rgba(13,14,18,0.9); stroke-width: 3px;
    }

    #toolbar {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      display: flex; flex-direction: column; gap: 8px;
      background: var(--bar-bg); color: var(--bar-fg);
      padding: 12px 14px; border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    #toolbar h1 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
    #toolbar h1 small { color: var(--accent); font-weight: 400; }
    #toolbar .row { display: flex; gap: 6px; flex-wrap: wrap; }
    #toolbar button {
      background: #2a2d38; color: var(--bar-fg); border: 1px solid #3a3e4c;
      border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer;
    }
    #toolbar button:hover { background: #3a3e4c; }
    #toolbar button.active { background: var(--accent); color: #0d0e12; border-color: var(--accent); }

    #dsl-toggle {
      position: fixed; bottom: 12px; left: 12px; z-index: 10;
      background: var(--bar-bg); color: var(--bar-fg);
      border: 1px solid #3a3e4c; border-radius: 6px; padding: 6px 10px;
      font-size: 12px; cursor: pointer;
    }
    #dsl-panel {
      position: fixed; bottom: 48px; left: 12px; right: 12px; z-index: 9;
      background: var(--bar-bg); border-radius: 10px; padding: 10px;
      display: none; flex-direction: column; gap: 8px;
      max-height: 40vh;
    }
    #dsl-panel.open { display: flex; }
    #dsl-input {
      width: 100%; min-height: 140px; resize: vertical;
      background: #14161c; color: #d8dae4; border: 1px solid #3a3e4c;
      border-radius: 6px; padding: 8px; font-family: monospace; font-size: 12px;
    }
    #dsl-panel .actions { display: flex; gap: 8px; }
    #dsl-panel button {
      background: var(--accent); color: #0d0e12; border: none;
      border-radius: 6px; padding: 6px 14px; font-size: 12px; cursor: pointer;
    }

    #search-bar {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      z-index: 10; width: 260px;
      background: var(--bar-bg); border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    #search-input {
      width: 100%; padding: 10px 14px;
      background: transparent; color: var(--bar-fg);
      border: 1px solid #3a3e4c; border-radius: 10px;
      font-size: 13px; outline: none;
    }
    #search-input:focus { border-color: var(--accent); }
    #search-results {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      max-height: 200px; overflow-y: auto;
      background: var(--bar-bg);
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    #search-results .item {
      padding: 8px 14px; font-size: 12px; cursor: pointer;
      color: var(--bar-fg);
      border-bottom: 1px solid #2a2d38;
    }
    #search-results .item:last-child { border-bottom: none; }
    #search-results .item:hover { background: #2a2d38; }

    #detail-card {
      position: fixed; top: 12px; right: 12px; z-index: 20;
      width: 300px; max-height: 70vh; overflow-y: auto;
      background: var(--bar-bg); color: var(--bar-fg);
      border-radius: 10px; padding: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    #detail-card.hidden { display: none; }

    #surface-panel {
      position: fixed; bottom: 12px; right: 12px; z-index: 15;
      background: var(--bar-bg); color: var(--bar-fg);
      border-radius: 10px; padding: 12px 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      display: none; flex-direction: column; gap: 8px; width: 240px;
    }
    #surface-panel.open { display: flex; }
    #surface-panel h3 { margin: 0; font-size: 13px; }
    #surface-panel label { font-size: 12px; display: flex; justify-content: space-between; }
    #surface-panel input[type=range] { width: 130px; }
    #surface-panel .val { color: var(--accent); }
    #surface-toggle {
      position: fixed; bottom: 12px; right: 12px; z-index: 16;
      background: var(--bar-bg); color: var(--bar-fg);
      border: 1px solid #3a3e4c; border-radius: 6px; padding: 6px 10px;
      font-size: 12px; cursor: pointer;
    }
    #detail-card h2 { margin: 0 0 8px; font-size: 15px; word-break: break-word; }
    #detail-card .meta { font-size: 12px; color: #a0a4b4; margin-bottom: 4px; }
    #detail-card .meta b { color: var(--accent); }
    #detail-card .desc {
      margin-top: 8px; font-size: 12px; line-height: 1.6;
      white-space: pre-wrap; word-break: break-word; color: #c8cad4;
    }
    #detail-close {
      position: absolute; top: 8px; right: 8px;
      background: none; border: none; color: var(--bar-fg);
      font-size: 16px; cursor: pointer; padding: 4px 8px;
    }
  </style>
</head>
<body>
  <canvas id="aether-canvas"></canvas>
  <svg id="label-layer"></svg>

  <div id="toolbar">
    <h1>Aether3D <small>Phase 1</small></h1>
    <div class="row" id="layout-buttons">
      <button data-mode="spring" class="active">星団</button>
      <button data-mode="tree-lr">ツリー横</button>
      <button data-mode="tree-tb">ツリー縦</button>
      <button data-mode="timeline">タイムライン</button>
    </div>
    <div class="row" id="view-buttons">
      <button data-view="2d" class="active">2D</button>
      <button data-view="3d">3D</button>
      <button data-view="side">側面</button>
      <button id="reset-view">リセット</button>
    </div>
  </div>

  <div id="search-bar">
    <input id="search-input" type="text" placeholder="ノードを検索…">
    <div id="search-results"></div>
  </div>

  <button id="dsl-toggle">DSL</button>
  <div id="dsl-panel">
    <textarea id="dsl-input" spellcheck="false"></textarea>
    <div class="actions">
      <button id="load-dsl">読み込み</button>
    </div>
  </div>

  <div id="detail-card" class="hidden">
    <button id="detail-close">×</button>
    <h2 id="detail-title"></h2>
    <div class="meta" id="detail-role"></div>
    <div class="meta" id="detail-time"></div>
    <div class="meta" id="detail-tags"></div>
    <div class="desc" id="detail-desc"></div>
  </div>

  <button id="surface-toggle">曲面</button>
  <div id="surface-panel">
    <h3>数学曲面</h3>
    <label>振幅 <input type="range" id="surf-amp" min="0" max="150" value="60"><span class="val" id="surf-amp-val">60</span></label>
    <label>周波数 <input type="range" id="surf-freq" min="0" max="0.1" step="0.005" value="0.03"><span class="val" id="surf-freq-val">0.030</span></label>
    <label>位相 <input type="range" id="surf-phase" min="0" max="6.28" step="0.1" value="0"><span class="val" id="surf-phase-val">0.0</span></label>
    <label>湾曲 <input type="range" id="surf-bend" min="0" max="0.005" step="0.0005" value="0"><span class="val" id="surf-bend-val">0.0000</span></label>
  </div>

  <script src="vendor/ogl.min.js"></script>
  <script src="vendor/katex/katex.min.js"></script>
  <script src="vendor/katex/contrib/auto-render.min.js"></script>
  <script src="aether_parser.js"></script>
  <script src="aether3d_state.js"></script>
  <script src="aether3d_layout.js"></script>
  <script src="aether3d_core.js"></script>
  <script>
  (function () {
    'use strict';
    const OGL = window.OGL;
    const canvas = document.getElementById('aether-canvas');

    const { renderer, gl, camera, scene } = Aether3DCore.createRenderer(
      canvas, window.innerWidth, window.innerHeight);
    const controls = new OGL.Orbit(camera, { element: canvas });

    const dslInput = document.getElementById('dsl-input');
    dslInput.value = [
      '# board: layout_smoke_20260813',
      'sticky SMOKE_TITLE "置き場テスト" {',
      '  pos: 480 80',
      '  color: "blue"',
      '  role: "claim"',
      '  time: "1_確認"',
      '}',
      'sticky SMOKE_CLI "CLI" {',
      '  pos: 160 320',
      '  color: "green"',
      '  role: "evidence"',
      '  time: "1_確認"',
      '}',
      'sticky SMOKE_UI "UI / LIVE" {',
      '  pos: 480 320',
      '  color: "green"',
      '  role: "evidence"',
      '  time: "1_確認"',
      '}',
      'sticky SMOKE_DB "SQLite" {',
      '  pos: 800 320',
      '  color: "green"',
      '  role: "evidence"',
      '  time: "1_確認"',
      '}',
      'sticky SMOKE_AUTO1 "自動配置A" {',
      '  color: "orange"',
      '  role: "claim"',
      '  time: "2_検討"',
      '}',
      'sticky SMOKE_AUTO2 "自動配置B" {',
      '  color: "purple"',
      '  role: "claim"',
      '  time: "3_決定"',
      '}',
      'sticky SMOKE_MATH "数式テスト" {',
      '  pos: 480 620',
      '  color: "pink"',
      '  role: "claim"',
      '  time: "1_確認"',
      '  desc: "オイラーの公式: $e^{i\\pi} + 1 = 0$\\n\\nフーリエ級数: $$f(x) = a_0 + \\sum_{n=1}^{\\infty} (a_n \\cos nx + b_n \\sin nx)$$"',
      '}',
      'relation SMOKE_CLI -> SMOKE_TITLE { type: "evidence" label: "書く" }',
      'relation SMOKE_DB -> SMOKE_TITLE { type: "evidence" label: "正本" }',
      'relation SMOKE_TITLE -> SMOKE_UI { type: "default" label: "投影" }',
      'relation SMOKE_TITLE -> SMOKE_AUTO1 { type: "default" label: "展開" }',
      'relation SMOKE_AUTO1 -> SMOKE_AUTO2 { type: "default" label: "次" }',
      '',
    ].join('\n');

    function shapeFor(note) {
      if (note.role === 'claim') return 'hexagon';
      if (note.role === 'evidence') return 'circle';
      return 'square';
    }

    let nodeMeshes = [];

    function renderBoard() {
      Aether3DState.loadDSL(dslInput.value);
      const notes = Aether3DState.getNotes();
      const relations = Aether3DState.getRelations();
      const connections = Aether3DState.getConnections();
      const mode = Aether3DState.getLayoutMode();

      const positions = Aether3DLayout.computeLayout(notes, relations, connections, mode);

      while (scene.children.length) scene.removeChild(scene.children[0]);
      nodeMeshes = [];

      const edges = [];
      relations.forEach(r => edges.push([r.from, r.to]));
      connections.forEach(c => edges.push([c.source, c.target]));
      edges.forEach(([a, b]) => {
        const pa = positions[a], pb = positions[b];
        if (!pa || !pb) return;
        scene.addChild(Aether3DCore.buildEdge(gl, '#7a7f8f', pa[0], pa[1], pb[0], pb[1]));
      });

      notes.forEach(n => {
        const p = positions[n.id] || [0, 0];
        const color = Aether3DCore.colorToHex(n.color);
        const mesh = Aether3DCore.buildNode(gl, shapeFor(n), color, p[0], p[1], 60);
        mesh.userData = { note: n, isNode: true };
        nodeMeshes.push(mesh);
        scene.addChild(mesh);
      });

      const labelLayer = document.getElementById('label-layer');
      labelLayer.innerHTML = '';
      nodeMeshes.forEach(mesh => {
        const note = mesh.userData.note;
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.textContent = note.content || note.id;
        text.setAttribute('text-anchor', 'middle');
        text.dataset.nodeId = note.id;
        labelLayer.appendChild(text);
      });
    }

    function showDetailCard(note) {
      document.getElementById('detail-title').textContent = note.content || '';
      document.getElementById('detail-role').innerHTML = note.role ? '<b>役割:</b> ' + note.role : '';
      document.getElementById('detail-time').innerHTML = note.time ? '<b>時間:</b> ' + note.time : '';
      document.getElementById('detail-tags').innerHTML =
        note.tags && note.tags.length ? '<b>タグ:</b> ' + note.tags.join(' ') : '';
      const descEl = document.getElementById('detail-desc');
      descEl.textContent = note.desc || '';
      if (window.renderMathInElement) {
        renderMathInElement(descEl, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false },
          ],
          throwOnError: false,
        });
      }
      document.getElementById('detail-card').classList.remove('hidden');
    }

    function hideDetailCard() {
      document.getElementById('detail-card').classList.add('hidden');
    }

    function worldToScreen(camera, x, y, z) {
      const view = new OGL.Mat4();
      view.inverse(camera.worldMatrix);
      const viewProj = new OGL.Mat4();
      viewProj.multiply(camera.projectionMatrix, view);
      const p = new OGL.Vec3(x, y, z);
      p.applyMatrix4(viewProj);
      const sx = (p.x + 1) / 2 * canvas.clientWidth;
      const sy = (1 - p.y) / 2 * canvas.clientHeight;
      return { x: sx, y: sy };
    }

    let pointerDownPos = null;

    canvas.addEventListener('pointerdown', (e) => {
      pointerDownPos = { x: e.clientX, y: e.clientY };
    });

    canvas.addEventListener('pointerup', (e) => {
      if (!pointerDownPos) return;
      const dx = e.clientX - pointerDownPos.x;
      const dy = e.clientY - pointerDownPos.y;
      pointerDownPos = null;
      if (Math.abs(dx) > 6 || Math.abs(dy) > 6) return;

      let best = null;
      let bestDist = 60;
      nodeMeshes.forEach(mesh => {
        const p = mesh.position;
        const s = worldToScreen(camera, p.x, p.y, p.z);
        const d = Math.hypot(s.x - e.clientX, s.y - e.clientY);
        if (d < bestDist) { bestDist = d; best = mesh; }
      });
      if (best && best.userData.note) {
        showDetailCard(best.userData.note);
      } else {
        hideDetailCard();
      }
    });

    document.getElementById('detail-close').addEventListener('click', hideDetailCard);

    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');
    searchResults.style.display = 'none';

    function focusOnNode(nodeId) {
      const mesh = nodeMeshes.find(m => m.userData.note.id === nodeId);
      if (!mesh) return;
      const p = mesh.position;
      camera.position.set(p.x, p.y, 600);
      controls.target.set(p.x, p.y, 0);
      controls.forcePosition();
      showDetailCard(mesh.userData.note);
    }

    searchInput.addEventListener('input', () => {
      const q = searchInput.value.trim().toLowerCase();
      const results = document.getElementById('search-results');
      results.innerHTML = '';
      if (!q) { results.style.display = 'none'; return; }

      const notes = Aether3DState.getNotes();
      const hits = notes.filter(n =>
        (n.content || '').toLowerCase().includes(q) ||
        (n.desc || '').toLowerCase().includes(q) ||
        (n.tags || []).some(t => t.toLowerCase().includes(q))
      ).slice(0, 10);

      if (hits.length === 0) { results.style.display = 'none'; return; }

      hits.forEach(n => {
        const item = document.createElement('div');
        item.className = 'item';
        item.textContent = n.content || n.id;
        item.addEventListener('mousedown', (e) => {
          e.preventDefault();
          focusOnNode(n.id);
          searchInput.value = '';
          results.style.display = 'none';
        });
        results.appendChild(item);
      });
      results.style.display = 'block';
    });

    searchInput.addEventListener('blur', () => {
      setTimeout(() => { searchResults.style.display = 'none'; }, 150);
    });

    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
        e.preventDefault();
        searchInput.focus();
        searchInput.select();
      } else if (e.key === '/') {
        e.preventDefault();
        searchInput.focus();
      } else if (e.key === 'r') {
        camera.position.set(0, 0, 900);
        controls.target.set(0, 0, 0);
        controls.forcePosition();
      } else if (e.key === '1') {
        setView('2d');
      } else if (e.key === '2') {
        setView('3d');
      } else if (e.key === '3') {
        setView('side');
      }
    });

    function setActiveMode(mode) {
      document.querySelectorAll('#layout-buttons [data-mode]').forEach(b => {
        b.classList.toggle('active', b.dataset.mode === mode);
      });
    }

    document.querySelectorAll('#layout-buttons [data-mode]').forEach(btn => {
      btn.addEventListener('click', () => {
        Aether3DState.setLayoutMode(btn.dataset.mode);
        setActiveMode(btn.dataset.mode);
        renderBoard();
      });
    });

    document.getElementById('reset-view').addEventListener('click', () => {
      camera.position.set(0, 0, 900);
      controls.target.set(0, 0, 0);
      controls.forcePosition();
    });

    function setView(mode) {
      const t = controls.target;
      const tx = t.x, ty = t.y;
      if (mode === '2d') {
        camera.position.set(tx, ty, 900);
        controls.mouseButtons.ORBIT = 5;  // 回転を無効化（存在しないボタン）
        controls.mouseButtons.PAN = 0;    // 左ドラッグ = パン
      } else {
        camera.position.set(
          mode === '3d' ? tx + 500 : tx + 900,
          mode === '3d' ? ty + 400 : ty,
          mode === '3d' ? 700 : 300
        );
        controls.mouseButtons.ORBIT = 0;  // 左ドラッグ = 回転
        controls.mouseButtons.PAN = 2;    // 右ドラッグ = パン
      }
      controls.forcePosition();
      document.querySelectorAll('#view-buttons [data-view]').forEach(b => {
        b.classList.toggle('active', b.dataset.view === mode);
      });
    }

    document.querySelectorAll('#view-buttons [data-view]').forEach(btn => {
      btn.addEventListener('click', () => setView(btn.dataset.view));
    });

    document.getElementById('load-dsl').addEventListener('click', renderBoard);

    document.getElementById('dsl-toggle').addEventListener('click', () => {
      document.getElementById('dsl-panel').classList.toggle('open');
    });

    let surfaceMesh = null;

    document.getElementById('surface-toggle').addEventListener('click', () => {
      const panel = document.getElementById('surface-panel');
      if (panel.classList.contains('open')) {
        panel.classList.remove('open');
        if (surfaceMesh) { scene.removeChild(surfaceMesh); surfaceMesh = null; }
      } else {
        panel.classList.add('open');
        if (!surfaceMesh) {
          surfaceMesh = Aether3DCore.buildSurface(gl, { width: 500, height: 500, segments: 64 });
          surfaceMesh.position.set(0, 0, 0);
          scene.addChild(surfaceMesh);
        }
      }
    });

    function bindSurfaceSlider(id, valId, key, decimals) {
      const el = document.getElementById(id);
      const val = document.getElementById(valId);
      el.addEventListener('input', () => {
        const v = parseFloat(el.value);
        val.textContent = decimals ? v.toFixed(decimals) : String(Math.round(v));
        if (surfaceMesh) Aether3DCore.updateSurface(surfaceMesh, { [key]: v });
      });
    }

    bindSurfaceSlider('surf-amp', 'surf-amp-val', 'amp', 0);
    bindSurfaceSlider('surf-freq', 'surf-freq-val', 'freq', 3);
    bindSurfaceSlider('surf-phase', 'surf-phase-val', 'phase', 1);
    bindSurfaceSlider('surf-bend', 'surf-bend-val', 'bend', 4);

    renderBoard();
    setView('2d');

    function loop() {
      requestAnimationFrame(loop);
      controls.update();
      scene.children.forEach(child => {
        if (child.userData && child.userData.isNode) {
          child.quaternion.copy(camera.quaternion);
        }
      });
      renderer.render({ scene, camera });

      const labelLayer = document.getElementById('label-layer');
      const labels = labelLayer.children;
      let li = 0;
      nodeMeshes.forEach(mesh => {
        if (li >= labels.length) return;
        const p = mesh.position;
        const s = worldToScreen(camera, p.x, p.y, p.z);
        const t = labels[li];
        t.setAttribute('x', s.x);
        t.setAttribute('y', s.y + 80);
        li++;
      });
    }
    loop();

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.perspective({ aspect: window.innerWidth / window.innerHeight });
    });
  })();
  </script>
</body>
</html>
